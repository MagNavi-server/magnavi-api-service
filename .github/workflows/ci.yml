name: Spring CI

# PR은 검증만 합니다. AWS 권한과 운영 비밀번호를 사용하지 않습니다.
on:
  pull_request:
    branches: [develop, release]

permissions:
  contents: read

concurrency:
  group: spring-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: PR 코드 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21 준비
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: 배포 실패 경로 검증
        run: python3 -m unittest discover -s scripts/tests -v

      - name: 운영 Compose 문법 검사 (가짜 설정만 사용)
        env:
          COMPOSE_DISABLE_ENV_FILE: 'true'
          SPRING_IMAGE: magnavi-api:ci-validation
          MYSQL_PASSWORD: isolated-ci-only
          JWT_SECRET_BASE64: aXNvbGF0ZWQtY2ktdmFsaWRhdGlvbi1vbmx5LWtleSE=
        run: docker compose --env-file /dev/null -f compose.prod.yaml config --quiet

      - name: 빌드와 격리 MySQL 테스트
        # Testcontainers가 테스트 전용 DB를 만들고 종료합니다.
        run: ./gradlew --no-daemon clean build --console=plain
