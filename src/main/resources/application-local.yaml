# 개발용 Compose의 기본 주소와 연결한다. 비밀번호는 실행 환경에서 주입한다.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${MAGNAVI_MYSQL_PORT:13306}/magnavi_local?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    # Compose가 설정한 root 계정과 같은 MYSQL_PASSWORD 값을 사용한다.
    username: root
    password: ${MYSQL_PASSWORD}

server:
  address: 127.0.0.1
